services:
  chat:
    # shortcut: in-memory chat state requires one replica, add broker-backed coordination before scaling
    deploy:
      replicas: 1
    ports:
      - '127.0.0.1:8082:8082'
    build:
      context: ../backend
      dockerfile: Dockerfile.chat
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR: ${LOG_DIR}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/app/healthcheck', 'http://localhost:8082/ready']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
